[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bzoo"
version = "0.1.0"
description = "Multiplicity corrections with an empirically calibrated null, for asset pricing and machine learning benchmarks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Pinar Aksoy" },
  { name = "Ismail Hakki Toroslu" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "requests>=2.28",
  "pyarrow>=12.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "ogb>=1.3.6", "scikit-learn>=1.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
